<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zyvo Gateway</title>
<style>
:root{--bg:#f1f4ff;--card:#fff;--line:#e3e8f7;--tx:#14183a;--mut:#6b7494;--pur:#2b4df5;--gold:#2b4df5;--ok:#10b981;--err:#ef4444;--soft:#eef1ff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--gold);text-decoration:none}
nav{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;color:var(--tx)}.logo b{color:var(--gold)}
#menu{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;font-size:20px;padding:2px 10px}
.links{display:flex;gap:16px;align-items:center;flex:1}.links form{margin:0}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(43,77,245,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(43,77,245,.06)}.stat small{color:var(--mut)}.stat div{font-size:22px;font-weight:700;margin-top:2px}
input,select{width:100%;padding:10px 12px;margin:4px 0 12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit}
label{color:var(--mut);font-size:13px}
button,.btn{display:inline-block;background:linear-gradient(135deg,#1d3fe0,#3d5cff);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn2{background:transparent;border:1px solid var(--line);color:var(--tx)}.danger{background:#b4232c}.gold{background:var(--pur);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--pur)}
.SUCCESS,.active{color:var(--ok)}.FAILED,.suspended,.EXPIRED{color:var(--err)}.PENDING{color:var(--gold)}
.flash{padding:11px 14px;border-radius:10px;margin-bottom:14px}.flash.ok{background:#d9f7ec;color:#065f46}.flash.err{background:#fde4e4;color:#991b1b}
pre,code{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;display:block;font-size:13px}
.bar{height:12px;background:linear-gradient(90deg,#2b4df5,#8b7bff);border-radius:8px}.hl{background:linear-gradient(180deg,#f4f6ff,#eaeeff)}.big{font-size:30px!important}
h1,h2,h3{margin:.2em 0 .6em}.hero{text-align:center;padding:50px 0}.hero h1{font-size:34px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){ #menu{display:block}.links{display:none;width:100%;flex-direction:column;align-items:flex-start}.links.open{display:flex}}
</style></head><body>
<nav><a class="logo" href="/">Zyvo<b>Gateway</b></a><button id="menu" onclick="document.querySelector('.links').classList.toggle('open')">☰</button>
<div class="links">
{% if user %}<a href="/dashboard">Dashboard</a><a href="/gateways">Gateways</a><a href="/keys">API Keys</a><a href="/transactions">Transactions</a><a href="/webhooks">Webhooks</a><a href="/subscription">Plan</a><a href="/settings">Settings</a><a href="/docs-api">Docs</a>
{% if user.role in ['owner','seller'] %}<a href="/team">Team</a>{% endif %}
{% if user.role=='owner' %}<a href="/admin">Owner Panel</a>{% endif %}
<form method="post" action="/logout" style="margin-left:auto"><input type="hidden" name="csrf" value="{{csrf}}"><button class="btn2">Logout</button></form>
{% else %}<a href="/docs-api">Docs</a><span style="margin-left:auto"></span><a href="/login">Login</a><a class="btn" href="/register">Register</a>{% endif %}
</div></nav>
<main>{% if flash %}<div class="flash {{flash.k}}">{{flash.m}}</div>{% endif %}{% block c %}{% endblock %}</main></body></html>
