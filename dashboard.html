{% extends "base.html" %}{% block c %}
<style>.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.g4 .stat{padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.g4 .stat small{font-weight:700;letter-spacing:.06em;font-size:13px}.g4 .stat .big{font-size:32px!important;font-weight:800;margin:10px 0 6px}.g4 .stat em{font-style:normal;font-size:14px}.ok{color:var(--ok)}.mut{color:var(--mut)}@media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}}</style>
<div class="g4">
<div class="stat"><small>SUCCESSFUL VOLUME</small><div class="big">{{s.vol|rs}}</div><em class="ok">Verified payments</em></div>
<div class="stat"><small>TOTAL PAYMENTS</small><div class="big">{{s.total}}</div><em class="ok">{{s.vol|rs}} processed</em></div>
<div class="stat"><small>SUCCESSFUL</small><div class="big">{{s.ok}}</div><em class="ok">{{s.rate}}% success rate</em></div>
<div class="stat"><small>PENDING / FAILED</small><div class="big">{{s.pending}} / {{s.failed}}</div><em class="mut">Requires attention</em></div>
</div>{% endblock %}
